<!DOCTYPE html>
<html lang="cs" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ODIS Sledování spojů</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        odis: {
                            bg: '#0b0f17',
                            card: '#151c28',
                            border: '#2a3447',
                            accent: '#3b82f6',
                            green: '#10b981',
                            red: '#ef4444',
                            amber: '#f59e0b'
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #0b0f17;
            color: #f3f4f6;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        .glass-panel {
            background: rgba(21, 28, 40, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .match-green-bg {
            background: linear-gradient(135deg, rgba(6, 78, 59, 0.85) 0%, rgba(15, 23, 42, 0.9) 100%) !important;
            border-color: rgba(16, 185, 129, 0.5) !important;
            box-shadow: 0 10px 25px -5px rgba(16, 185, 129, 0.2);
        }
        /* Hide number input spinners (arrows) */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none;
            margin: 0; 
        }
        input[type=number] {
            -moz-appearance: textfield;
            appearance: textfield;
        }
    </style>
</head>
<body class="min-h-screen pb-24 text-slate-100 flex flex-col justify-between">

    <!-- Header & App Bar -->
    <header class="sticky top-0 z-30 glass-panel border-b border-slate-800/80 px-4 py-3 shadow-lg">
        <div class="max-w-md mx-auto flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div>
                    <h1 class="font-bold text-base leading-tight tracking-wide text-white">Sledování spojů</h1>
                    <div class="flex items-center text-xs text-slate-400 space-x-2 whitespace-nowrap shrink-0">
                        <span id="date-display" class="whitespace-nowrap">----.--.--</span>
                        <span>•</span>
                        <span id="status-text" class="text-slate-400 whitespace-nowrap">Čekání...</span>
                    </div>
                </div>
            </div>

            <div class="flex items-center space-x-2">
                <!-- Live Timer / Manual Refresh -->
                <button id="refresh-btn" onclick="manualRefresh()" title="Obnovit" class="relative p-2.5 rounded-xl bg-slate-800/80 hover:bg-slate-700/80 border border-slate-700/50 text-slate-300 active:scale-95 transition">
                    <i id="refresh-icon" class="fa-solid fa-rotate text-sm"></i>
                    <span id="timer-badge" class="absolute -top-1 -right-1 bg-blue-600 text-white text-[10px] font-bold w-5 h-5 rounded-full flex items-center justify-center border-2 border-slate-900">40</span>
                </button>
                <!-- Settings button -->
                <button onclick="toggleSettingsModal(true)" title="Nastavení" class="p-2.5 rounded-xl bg-slate-800/80 hover:bg-slate-700/80 border border-slate-700/50 text-slate-300 active:scale-95 transition">
                    <i class="fa-solid fa-gear text-sm"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="max-w-md mx-auto w-full px-4 pt-4 flex-grow space-y-4">
        
        <!-- Active Connections Header -->
        <div class="flex items-center justify-between px-1">
            <h2 class="text-xs font-semibold uppercase tracking-wider text-slate-400">Sledované spoje (<span id="sub-count">0</span>)</h2>
            <div class="flex items-center space-x-3">
                <button onclick="toggleSettingsModal(true)" class="text-xs text-blue-400 hover:text-blue-300 transition flex items-center gap-1 font-medium">
                    <i class="fa-solid fa-plus text-[10px]"></i> Přidat spoj
                </button>
                <button onclick="clearAllSubscriptions()" class="text-xs text-slate-500 hover:text-red-400 transition">Smazat vše</button>
            </div>
        </div>

        <!-- Cards Container -->
        <div id="cards-container" class="space-y-3">
            <!-- Dynamic cards injected via JavaScript -->
        </div>

        <!-- Empty State -->
        <div id="empty-state" class="hidden glass-panel rounded-2xl p-8 text-center space-y-3 border border-slate-800">
            <div class="w-12 h-12 mx-auto rounded-full bg-slate-800/80 flex items-center justify-center text-slate-500">
                <i class="fa-solid fa-bus text-xl"></i>
            </div>
            <div>
                <h3 class="font-semibold text-slate-200">Žádné sledované spoje</h3>
                <p class="text-xs text-slate-400 mt-1">Klepněte na ozubené kolečko nebo tlačítko "Přidat spoj" pro přidání linky.</p>
            </div>
        </div>

    </main>

    <!-- Settings Modal -->
    <div id="settings-modal" class="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm hidden flex items-center justify-center p-4">
        <div class="glass-panel bg-slate-900/95 max-w-sm w-full rounded-2xl p-5 space-y-4 border border-slate-700 shadow-2xl">
            <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                <h3 class="font-bold text-slate-100 flex items-center gap-2">
                    <i class="fa-solid fa-sliders text-blue-400"></i> Nastavení a Přidání
                </h3>
                <button onclick="toggleSettingsModal(false)" class="text-slate-400 hover:text-white p-1">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>

            <!-- Add Subscription Section in Modal -->
            <div class="space-y-2 pb-3 border-b border-slate-800">
                <div class="text-xs font-semibold text-slate-300 mb-1">Přidat nový spoj</div>
                <form id="add-form" onsubmit="handleAddSubscription(event)" class="space-y-2">
                    <div class="flex gap-2">
                        <div class="relative flex-1">
                            <input type="number" id="input-linka" placeholder="Linka" required inputmode="numeric"
                                class="w-full bg-slate-950 border border-slate-700/70 rounded-xl px-3 py-2 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-blue-500 transition">
                        </div>
                        <div class="relative flex-1">
                            <input type="number" id="input-spoj" placeholder="Spoj" required inputmode="numeric"
                                class="w-full bg-slate-950 border border-slate-700/70 rounded-xl px-3 py-2 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-blue-500 transition">
                        </div>
                    </div>
                    <div>
                        <input type="text" id="input-zastavka" placeholder="Sledovaná zastávka (volitelné)"
                            class="w-full bg-slate-950 border border-slate-700/70 rounded-xl px-3 py-2 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-emerald-500 transition">
                    </div>
                    <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 active:scale-95 text-white font-medium py-2 rounded-xl text-xs flex items-center justify-center gap-1.5 shadow-lg shadow-blue-600/25 transition">
                        <i class="fa-solid fa-plus text-xs"></i>
                        <span>Přidat spoj do sledování</span>
                    </button>
                </form>
            </div>

            <div class="space-y-3 text-xs">
                <!-- Daily Expiration Switch -->
                <div class="flex items-center justify-between pt-1">
                    <div>
                        <div class="font-semibold text-slate-300">Denní automatické mazání</div>
                        <div class="text-slate-400">Smazat sledované spoje o půlnoci</div>
                    </div>
                    <input type="checkbox" id="daily-reset-toggle" class="w-4 h-4 accent-blue-600 rounded cursor-pointer" checked onchange="toggleDailyResetSetting(this.checked)">
                </div>
            </div>

            <button onclick="toggleSettingsModal(false)" class="w-full bg-slate-800 hover:bg-slate-700 text-slate-300 font-medium py-2 rounded-xl text-xs transition border border-slate-700">
                Zavřít
            </button>
        </div>
    </div>

    <!-- Notifications Toast Container -->
    <div id="toast" class="fixed bottom-5 left-1/2 -translate-x-1/2 z-50 glass-panel px-4 py-2.5 rounded-full text-xs font-medium border border-slate-700/80 shadow-xl opacity-0 transition-all duration-300 pointer-events-none flex items-center gap-2">
        <i id="toast-icon" class="fa-solid fa-info-circle text-blue-400"></i>
        <span id="toast-msg">Zpráva</span>
    </div>

    <!-- Application Logic -->
    <script>
        /**
         * Dynamic obfuscated URL assembly algorithm
         */
        function getApiEndpoint() {
            const _p1 = ["aHR0cHM6Ly", "92YWJsb2I"];
            const _p2 = ["udmVyY2Vs", "LmFwcC9hcGkv"];
            const _p3 = ["Y29sbGVjdC1mbHc="];
            const raw = atob(_p1.join("") + _p2.join("") + _p3.join(""));
            return raw;
        }

        let subscriptions = [];
        let latestDataMap = new Map();
        let matchedStopsSet = new Set(); // Tracks items that hit the custom stop alert
        let countdown = 40;
        let timerInterval = null;
        let dailyResetEnabled = localStorage.getItem('odis_daily_reset') !== 'false';

        // Wake Lock & Background Worker Variables
        let wakeLock = null;
        let worker = null;

        function normalizeString(str) {
            if (!str) return '';
            return str
                .toLowerCase()
                .normalize("NFD")
                .replace(/[\u0300-\u036f]/g, "") // Remove accents/diacritics
                .replace(/[^a-z0-9]/g, "");     // Keep only alphanumeric
        }

        function getTodayString() {
            const d = new Date();
            const year = d.getFullYear();
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        window.onload = function() {
            document.getElementById('date-display').innerText = getTodayString();
            document.getElementById('daily-reset-toggle').checked = dailyResetEnabled;
            
            loadSubscriptions();
            renderCards();
            fetchMapData();
            startTimer();

            // Initialize Wake Lock & Background Web Worker
            requestWakeLock();
            initBackgroundWorker();

            // Re-acquire Wake Lock when page becomes visible again
            document.addEventListener('visibilitychange', () => {
                if (document.visibilityState === 'visible') {
                    requestWakeLock();
                }
            });
        };

        /**
         * Screen Wake Lock API to prevent mobile screen sleep while active
         */
        async function requestWakeLock() {
            try {
                if ('wakeLock' in navigator) {
                    wakeLock = await navigator.wakeLock.request('screen');
                }
            } catch (err) {
                console.log('Wake Lock request failed:', err.message);
            }
        }

        /**
         * Inline Web Worker to bypass main thread timer throttling when backgrounded/screen locked
         */
        function initBackgroundWorker() {
            try {
                const workerCode = `
                    let interval = null;
                    self.onmessage = function(e) {
                        if (e.data === 'start') {
                            if (!interval) {
                                interval = setInterval(() => {
                                    self.postMessage('tick');
                                }, 1000);
                            }
                        } else if (e.data === 'stop') {
                            clearInterval(interval);
                            interval = null;
                        }
                    };
                `;
                const blob = new Blob([workerCode], { type: 'application/javascript' });
                worker = new Worker(URL.createObjectURL(blob));

                worker.onmessage = function(e) {
                    if (e.data === 'tick') {
                        onTimerTick();
                    }
                };

                worker.postMessage('start');
            } catch (err) {
                console.warn('Web Worker setup failed, falling back to window.setInterval', err);
            }
        }

        function loadSubscriptions() {
            const storedDate = localStorage.getItem('odis_sub_date');
            const today = getTodayString();

            if (dailyResetEnabled && storedDate !== today) {
                subscriptions = [];
                localStorage.setItem('odis_sub_date', today);
                saveSubscriptions();
                showToast("Nový den: Včerejší spoje byly vymazány.");
            } else {
                const data = localStorage.getItem('odis_subscriptions');
                subscriptions = data ? JSON.parse(data) : [
                    { linka: "440", spoj: "54", zastavka: "" },
                    { linka: "543", spoj: "42", zastavka: "" }
                ];
            }
            updateSubCount();
        }

        function saveSubscriptions() {
            localStorage.setItem('odis_subscriptions', JSON.stringify(subscriptions));
            localStorage.setItem('odis_sub_date', getTodayString());
            updateSubCount();
        }

        function updateSubCount() {
            document.getElementById('sub-count').innerText = subscriptions.length;
        }

        function handleAddSubscription(e) {
            e.preventDefault();
            const linkaInput = document.getElementById('input-linka');
            const spojInput = document.getElementById('input-spoj');
            const zastavkaInput = document.getElementById('input-zastavka');
            
            const linka = linkaInput.value.trim();
            const spoj = spojInput.value.trim();
            const zastavka = zastavkaInput.value.trim();

            if (!linka || !spoj) return;

            const exists = subscriptions.some(s => s.linka === linka && s.spoj === spoj);
            if (exists) {
                showToast("Tento spoj již sledujete!");
                return;
            }

            subscriptions.push({ linka, spoj, zastavka });
            saveSubscriptions();
            renderCards();
            
            linkaInput.value = '';
            spojInput.value = '';
            zastavkaInput.value = '';
            showToast(`Přidáno: Linka ${linka} / Spoj ${spoj}`);

            toggleSettingsModal(false);
            fetchMapData();
        }

        function updateSubscriptionZastavka(linka, spoj, newZastavka) {
            const sub = subscriptions.find(s => s.linka === linka && s.spoj === spoj);
            if (sub) {
                sub.zastavka = newZastavka.trim();
                saveSubscriptions();
                renderCards();
                showToast("Cílová zastávka aktualizována");
            }
        }

        function toggleEditZastavka(key) {
            const el = document.getElementById(`edit-zastavka-${key}`);
            if (el) el.classList.toggle('hidden');
        }

        function removeSubscription(linka, spoj) {
            subscriptions = subscriptions.filter(s => !(s.linka === linka && s.spoj === spoj));
            saveSubscriptions();
            renderCards();
            showToast(`Odebráno: ${linka} / ${spoj}`);
        }

        function clearAllSubscriptions() {
            if (subscriptions.length === 0) return;
            subscriptions = [];
            saveSubscriptions();
            renderCards();
            showToast("Všechny spoje byly odebrány.");
        }

        async function fetchMapData() {
            const statusText = document.getElementById('status-text');
            const refreshIcon = document.getElementById('refresh-icon');

            statusText.innerText = "Aktualizace...";
            statusText.className = "text-blue-400 animate-pulse";
            refreshIcon.classList.add('fa-spin');

            try {
                const endpoint = getApiEndpoint();
                const response = await fetch(endpoint, {
                    method: 'GET',
                    headers: {
                        'Accept': 'application/json'
                    }
                });

                if (!response.ok) throw new Error(`HTTP Error: ${response.status}`);
                
                const data = await response.json();
                processItems(data.items || []);
                
                statusText.innerText = `Aktualizováno: ${new Date().toLocaleTimeString('cs-CZ', {hour: '2-digit', minute:'2-digit', second:'2-digit'})}`;
                statusText.className = "text-emerald-400";
            } catch (err) {
                console.warn("Backend API Fetch failed", err);
                statusText.innerText = "Chyba načítání serveru";
                statusText.className = "text-amber-400";
            } finally {
                refreshIcon.classList.remove('fa-spin');
                renderCards();
            }
        }

        function processItems(items) {
            latestDataMap.clear();

            items.forEach(item => {
                if (!item.l || !item.s) return;

                const linka = String(item.l);
                const spoj = String(item.s);

                const key = `${linka}-${spoj}`;
                latestDataMap.set(key, {
                    linka: linka,
                    spoj: spoj,
                    cil: formatStopName(item.dest || 'Neznámý cíl'),
                    posledniZastavka: formatStopName(item.p_stop || '-'),
                    nasledujiciZastavka: formatStopName(item.n_stop || '-'),
                    spz: item.plate || '',
                    delayMin: item.d !== undefined ? item.d : 0,
                    delayTxt: item.d_txt || '',
                    time: item.t || ''
                });
            });
        }

        function formatStopName(name) {
            if (!name) return '';
            return name
                .replace(/^Ostrava,/i, 'OV,')
                .replace(/^Frýdek-Místek,/i, 'FM,')
                .replace(/,/g, ', '); // Ensure space after commas for proper word wrapping
        }

        function renderCards() {
            const container = document.getElementById('cards-container');
            const emptyState = document.getElementById('empty-state');

            if (subscriptions.length === 0) {
                container.innerHTML = '';
                emptyState.classList.remove('hidden');
                return;
            }

            emptyState.classList.add('hidden');
            let html = '';

            subscriptions.forEach(sub => {
                const key = `${sub.linka}-${sub.spoj}`;
                const liveData = latestDataMap.get(key);
                const userZastavka = sub.zastavka || '';

                if (liveData) {
                    const isVcas = liveData.delayMin === 0;
                    const delayText = isVcas ? 'Včas' : `+${liveData.delayMin}'`;
                    
                    // Match check with normalized strings
                    const normUserZastavka = normalizeString(userZastavka);
                    const normPosledniStop = normalizeString(liveData.posledniZastavka);
                    
                    let isStopMatched = false;
                    if (normUserZastavka.length > 0 && normPosledniStop.length > 0) {
                        if (normPosledniStop.includes(normUserZastavka)) {
                            matchedStopsSet.add(key); // Persistent hit during runtime
                        }
                    }
                    if (matchedStopsSet.has(key)) {
                        isStopMatched = true;
                    }

                    // Checks if CURRENT stop specifically matches the search query right now
                    const isCurrentStopActiveMatch = normUserZastavka.length > 0 && normPosledniStop.includes(normUserZastavka);

                    // Card background dynamic state
                    const cardBgClass = isStopMatched 
                        ? 'match-green-bg' 
                        : 'glass-panel';

                    const badgeBg = isVcas ? 'bg-emerald-600 text-white' : 'bg-amber-500 text-slate-950 font-black';
                    const arrowLineColor = isVcas ? 'border-emerald-500' : 'border-amber-500';

                    html += `
                        <div class="${cardBgClass} rounded-2xl p-3.5 space-y-2.5 border border-slate-700/80 shadow-lg relative overflow-hidden transition-all duration-500">
                            <div class="absolute top-0 left-0 w-1.5 h-full ${isStopMatched ? 'bg-emerald-400' : (isVcas ? 'bg-emerald-500' : 'bg-amber-500')}"></div>

                            <!-- Header: Linka/Spoj + SPZ + Actions -->
                            <div class="flex items-center justify-between gap-2 pl-1">
                                <div class="flex items-center space-x-2 shrink-0">
                                    <span class="bg-blue-600 text-white font-black text-lg px-2.5 py-0.5 rounded-lg tracking-wide shrink-0">
                                        ${liveData.linka}
                                    </span>
                                    <span class="bg-slate-800 text-slate-300 font-bold text-sm px-2 py-0.5 rounded-md border border-slate-700 shrink-0">
                                        /${liveData.spoj}
                                    </span>
                                    ${liveData.spz ? `<span class="text-xs text-slate-400 font-medium shrink-0">(${liveData.spz})</span>` : ''}
                                </div>
                                <div class="flex items-center space-x-1 shrink-0">
                                    <button onclick="toggleEditZastavka('${key}')" title="Upravit sledovanou zastávku" class="text-slate-400 hover:text-emerald-400 p-1">
                                        <i class="fa-solid fa-pen text-xs"></i>
                                    </button>
                                    <button onclick="removeSubscription('${sub.linka}', '${sub.spoj}')" title="Odebrat" class="text-slate-400 hover:text-red-400 p-1">
                                        <i class="fa-solid fa-xmark text-base"></i>
                                    </button>
                                </div>
                            </div>

                            <!-- Destination (Cíl) in its own dedicated line -->
                            <div class="pl-1 pr-1">
                                <div class="text-xs text-slate-400 uppercase tracking-wider font-semibold text-[10px]">Cíl</div>
                                <div class="text-sm font-bold text-white truncate" title="${liveData.cil}">
                                    ${liveData.cil}
                                </div>
                            </div>

                            <!-- Collapsible Stop Filter Editor -->
                            <div id="edit-zastavka-${key}" class="hidden bg-slate-900/90 rounded-xl p-2 border border-slate-700/80">
                                <div class="flex gap-2 items-center">
                                    <input type="text" id="input-edit-z-${key}" value="${userZastavka}" placeholder="Sledovaná zastávka..."
                                        class="flex-1 bg-slate-800 border border-slate-700 rounded-lg px-2.5 py-1 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-emerald-500">
                                    <button onclick="updateSubscriptionZastavka('${sub.linka}', '${sub.spoj}', document.getElementById('input-edit-z-${key}').value)"
                                        class="bg-emerald-600 hover:bg-emerald-500 text-white px-3 py-1 rounded-lg text-xs font-medium">
                                        Uložit
                                    </button>
                                </div>
                            </div>

                            <!-- Integrated Route & Delay Arrow Display -->
                            <div class="bg-slate-900/80 rounded-xl p-2.5 border border-slate-800/90 flex items-center justify-between gap-2">
                                <!-- Poslední Zastávka (With hover/touch reveal) -->
                                <div class="flex-1 text-left min-w-0 px-1.5 cursor-pointer group" title="${liveData.posledniZastavka}">
                                    <div class="font-bold ${isCurrentStopActiveMatch ? 'text-emerald-300 underline decoration-emerald-400 decoration-2' : 'text-slate-100'} text-xs sm:text-sm leading-snug truncate group-hover:whitespace-normal group-hover:overflow-visible active:whitespace-normal">
                                        ${liveData.posledniZastavka}
                                    </div>
                                </div>

                                <!-- Arrow with Delay Embedded -->
                                <div class="flex flex-col items-center justify-center shrink-0 px-1 relative w-20">
                                    <div class="w-full border-t-2 border-dashed ${arrowLineColor} absolute top-1/2 -translate-y-1/2 z-0"></div>
                                    <span class="z-10 text-[11px] font-extrabold px-2 py-0.5 rounded-full shadow-md ${badgeBg}">
                                        ${delayText}
                                    </span>
                                </div>

                                <!-- Následující Zastávka (With hover/touch reveal) -->
                                <div class="flex-1 text-right min-w-0 px-1.5 cursor-pointer group" title="${liveData.nasledujiciZastavka}">
                                    <div class="font-bold text-blue-400 text-xs sm:text-sm leading-snug truncate group-hover:whitespace-normal group-hover:overflow-visible active:whitespace-normal">
                                        ${liveData.nasledujiciZastavka}
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                } else {
                    html += `
                        <div class="glass-panel rounded-2xl p-3 space-y-2 border border-slate-800/60 opacity-60">
                            <div class="flex items-center justify-between">
                                <div class="flex items-center space-x-2">
                                    <span class="bg-slate-800 text-slate-300 font-bold text-base px-2.5 py-0.5 rounded-lg border border-slate-700">
                                        ${sub.linka}
                                    </span>
                                    <span class="text-slate-400 text-sm font-semibold">
                                        /${sub.spoj}
                                    </span>
                                    ${sub.zastavka ? `<span class="text-xs text-slate-500 italic">(${sub.zastavka})</span>` : ''}
                                </div>
                                <div class="flex items-center space-x-2">
                                    <span class="text-[10px] bg-slate-800 text-slate-400 px-2 py-0.5 rounded-full border border-slate-700/80">
                                        Není v provozu
                                    </span>
                                    <button onclick="removeSubscription('${sub.linka}', '${sub.spoj}')" title="Odebrat" class="text-slate-500 hover:text-red-400 p-1">
                                        <i class="fa-solid fa-xmark text-sm"></i>
                                    </button>
                                </div>
                            </div>
                        </div>
                    `;
                }
            });

            container.innerHTML = html;
        }

        function startTimer() {
            clearInterval(timerInterval);
            countdown = 40;
            updateBadge();
            
            // If Web Worker is active, it will handle ticks independently of tab focus
            if (!worker) {
                timerInterval = setInterval(onTimerTick, 1000);
            }
        }

        function onTimerTick() {
            countdown--;
            updateBadge();
            if (countdown <= 0) {
                countdown = 40;
                fetchMapData();
            }
        }

        function updateBadge() {
            document.getElementById('timer-badge').innerText = countdown;
        }

        function manualRefresh() {
            startTimer();
            fetchMapData();
        }

        function toggleSettingsModal(show) {
            const modal = document.getElementById('settings-modal');
            if (show) modal.classList.remove('hidden');
            else modal.classList.add('hidden');
        }

        function toggleDailyResetSetting(checked) {
            dailyResetEnabled = checked;
            localStorage.setItem('odis_daily_reset', checked);
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-msg').innerText = msg;
            toast.classList.remove('opacity-0', 'pointer-events-none');
            toast.classList.add('opacity-100');
            
            setTimeout(() => {
                toast.classList.remove('opacity-100');
                toast.classList.add('opacity-0', 'pointer-events-none');
            }, 3000);
        }
    </script>
</body>
</html>
