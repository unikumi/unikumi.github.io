<!DOCTYPE html>
<html lang="cs" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ODIS Sledování spojů</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        odis: {
                            bg: '#0b0f17',
                            card: '#151c28',
                            border: '#2a3447',
                            accent: '#3b82f6',
                            green: '#10b981',
                            red: '#ef4444',
                            amber: '#f59e0b'
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #0b0f17;
            color: #f3f4f6;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        .glass-panel {
            background: rgba(21, 28, 40, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        /* Hide number input spinners (arrows) */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none;
            margin: 0; 
        }
        input[type=number] {
            -moz-appearance: textfield;
            appearance: textfield;
        }
    </style>
</head>
<body class="min-h-screen pb-24 text-slate-100 flex flex-col justify-between">

    <!-- Header & App Bar -->
    <header class="sticky top-0 z-30 glass-panel border-b border-slate-800/80 px-4 py-3 shadow-lg">
        <div class="max-w-md mx-auto flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-9 h-9 rounded-xl bg-blue-600/20 border border-blue-500/30 flex items-center justify-center text-blue-400 font-bold text-lg">
                    <i class="fa-solid font-mono text-sm">ODIS</i>
                </div>
                <div>
                    <h1 class="font-bold text-base leading-tight tracking-wide text-white">Sledování spojů</h1>
                    <div class="flex items-center text-xs text-slate-400 space-x-2">
                        <span id="date-display">----.--.--</span>
                        <span>•</span>
                        <span id="status-text" class="text-slate-400">Čekání...</span>
                    </div>
                </div>
            </div>

            <div class="flex items-center space-x-2">
                <!-- Live Timer / Manual Refresh -->
                <button id="refresh-btn" onclick="manualRefresh()" title="Obnovit" class="relative p-2.5 rounded-xl bg-slate-800/80 hover:bg-slate-700/80 border border-slate-700/50 text-slate-300 active:scale-95 transition">
                    <i id="refresh-icon" class="fa-solid fa-rotate text-sm"></i>
                    <span id="timer-badge" class="absolute -top-1 -right-1 bg-blue-600 text-white text-[10px] font-bold w-5 h-5 rounded-full flex items-center justify-center border-2 border-slate-900">40</span>
                </button>
                <!-- Settings button -->
                <button onclick="toggleSettingsModal(true)" title="Nastavení" class="p-2.5 rounded-xl bg-slate-800/80 hover:bg-slate-700/80 border border-slate-700/50 text-slate-300 active:scale-95 transition">
                    <i class="fa-solid fa-gear text-sm"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="max-w-md mx-auto w-full px-4 pt-4 flex-grow space-y-4">
        
        <!-- Add Subscription Bar -->
        <section class="glass-panel rounded-2xl p-3.5 shadow-xl border border-slate-800">
            <form id="add-form" onsubmit="handleAddSubscription(event)" class="flex gap-2 items-center">
                <div class="flex-1 flex gap-2">
                    <div class="relative flex-1">
                        <input type="number" id="input-linka" placeholder="Linka" required inputmode="numeric"
                            class="w-full bg-slate-900/90 border border-slate-700/70 rounded-xl px-3 py-2 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-blue-500 transition">
                    </div>
                    <div class="relative flex-1">
                        <input type="number" id="input-spoj" placeholder="Spoj" required inputmode="numeric"
                            class="w-full bg-slate-900/90 border border-slate-700/70 rounded-xl px-3 py-2 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-blue-500 transition">
                    </div>
                </div>
                <button type="submit" class="bg-blue-600 hover:bg-blue-500 active:scale-95 text-white font-medium px-4 py-2 rounded-xl text-sm flex items-center gap-1.5 shadow-lg shadow-blue-600/25 transition">
                    <i class="fa-solid fa-plus text-xs"></i>
                    <span>Přidat</span>
                </button>
            </form>
        </section>

        <!-- Active Connections Header -->
        <div class="flex items-center justify-between px-1">
            <h2 class="text-xs font-semibold uppercase tracking-wider text-slate-400">Sledované spoje (<span id="sub-count">0</span>)</h2>
            <button onclick="clearAllSubscriptions()" class="text-xs text-slate-500 hover:text-red-400 transition">Smazat vše</button>
        </div>

        <!-- Cards Container -->
        <div id="cards-container" class="space-y-3">
            <!-- Dynamic cards injected via JavaScript -->
        </div>

        <!-- Empty State -->
        <div id="empty-state" class="hidden glass-panel rounded-2xl p-8 text-center space-y-3 border border-slate-800">
            <div class="w-12 h-12 mx-auto rounded-full bg-slate-800/80 flex items-center justify-center text-slate-500">
                <i class="fa-solid fa-bus text-xl"></i>
            </div>
            <div>
                <h3 class="font-semibold text-slate-200">Žádné sledované spoje</h3>
                <p class="text-xs text-slate-400 mt-1">Zadejte číslo linky a spoje výše pro sledování aktuální polohy a zpoždění.</p>
            </div>
        </div>

    </main>

    <!-- Settings Modal -->
    <div id="settings-modal" class="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm hidden flex items-center justify-center p-4">
        <div class="glass-panel bg-slate-900/95 max-w-sm w-full rounded-2xl p-5 space-y-4 border border-slate-700 shadow-2xl">
            <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                <h3 class="font-bold text-slate-100 flex items-center gap-2">
                    <i class="fa-solid fa-sliders text-blue-400"></i> Nastavení
                </h3>
                <button onclick="toggleSettingsModal(false)" class="text-slate-400 hover:text-white p-1">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>

            <div class="space-y-3 text-xs">
                <!-- Daily Expiration Switch -->
                <div class="flex items-center justify-between pt-1">
                    <div>
                        <div class="font-semibold text-slate-300">Denní automatické mazání</div>
                        <div class="text-slate-400">Smazat sledované spoje o půlnoci</div>
                    </div>
                    <input type="checkbox" id="daily-reset-toggle" class="w-4 h-4 accent-blue-600 rounded cursor-pointer" checked onchange="toggleDailyResetSetting(this.checked)">
                </div>

                <!-- Debug Simulator Button -->
                <div class="pt-3 border-t border-slate-800">
                    <button onclick="injectDemoData()" class="w-full bg-slate-800 hover:bg-slate-700 text-blue-400 border border-blue-500/30 rounded-xl py-2 font-medium flex items-center justify-center gap-2 transition">
                        <i class="fa-solid fa-flask"></i> Načíst testovací data (Demo)
                    </button>
                </div>
            </div>

            <button onclick="toggleSettingsModal(false)" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-medium py-2.5 rounded-xl text-xs transition">
                Zavřít
            </button>
        </div>
    </div>

    <!-- Notifications Toast Container -->
    <div id="toast" class="fixed bottom-5 left-1/2 -translate-x-1/2 z-50 glass-panel px-4 py-2.5 rounded-full text-xs font-medium border border-slate-700/80 shadow-xl opacity-0 transition-all duration-300 pointer-events-none flex items-center gap-2">
        <i id="toast-icon" class="fa-solid fa-info-circle text-blue-400"></i>
        <span id="toast-msg">Zpráva</span>
    </div>

    <!-- Application Logic -->
    <script>
        /**
         * Backend API Endpoint URL
         */
        const API_ENDPOINT = "https://vablob.vercel.app/api/collect-flw";

        let subscriptions = [];
        let latestDataMap = new Map();
        let countdown = 40;
        let timerInterval = null;
        let dailyResetEnabled = localStorage.getItem('odis_daily_reset') !== 'false';

        function getTodayString() {
            const d = new Date();
            const year = d.getFullYear();
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        window.onload = function() {
            document.getElementById('date-display').innerText = getTodayString();
            document.getElementById('daily-reset-toggle').checked = dailyResetEnabled;
            
            loadSubscriptions();
            renderCards();
            fetchMapData();
            startTimer();
        };

        function loadSubscriptions() {
            const storedDate = localStorage.getItem('odis_sub_date');
            const today = getTodayString();

            if (dailyResetEnabled && storedDate !== today) {
                subscriptions = [];
                localStorage.setItem('odis_sub_date', today);
                saveSubscriptions();
                showToast("Nový den: Včerejší spoje byly vymazány.");
            } else {
                const data = localStorage.getItem('odis_subscriptions');
                subscriptions = data ? JSON.parse(data) : [
                    { linka: "440", spoj: "54" },
                    { linka: "543", spoj: "42" }
                ];
            }
            updateSubCount();
        }

        function saveSubscriptions() {
            localStorage.setItem('odis_subscriptions', JSON.stringify(subscriptions));
            localStorage.setItem('odis_sub_date', getTodayString());
            updateSubCount();
        }

        function updateSubCount() {
            document.getElementById('sub-count').innerText = subscriptions.length;
        }

        function handleAddSubscription(e) {
            e.preventDefault();
            const linkaInput = document.getElementById('input-linka');
            const spojInput = document.getElementById('input-spoj');
            
            const linka = linkaInput.value.trim();
            const spoj = spojInput.value.trim();

            if (!linka || !spoj) return;

            const exists = subscriptions.some(s => s.linka === linka && s.spoj === spoj);
            if (exists) {
                showToast("Tento spoj již sledujete!");
                return;
            }

            subscriptions.push({ linka, spoj });
            saveSubscriptions();
            renderCards();
            
            linkaInput.value = '';
            spojInput.value = '';
            showToast(`Přidáno: Linka ${linka} / Spoj ${spoj}`);

            fetchMapData();
        }

        function removeSubscription(linka, spoj) {
            subscriptions = subscriptions.filter(s => !(s.linka === linka && s.spoj === spoj));
            saveSubscriptions();
            renderCards();
            showToast(`Odebráno: ${linka} / ${spoj}`);
        }

        function clearAllSubscriptions() {
            if (subscriptions.length === 0) return;
            subscriptions = [];
            saveSubscriptions();
            renderCards();
            showToast("Všechny spoje byly odebrány.");
        }

        async function fetchMapData() {
            const statusText = document.getElementById('status-text');
            const refreshIcon = document.getElementById('refresh-icon');

            statusText.innerText = "Aktualizace...";
            statusText.className = "text-blue-400 animate-pulse";
            refreshIcon.classList.add('fa-spin');

            try {
                const response = await fetch(API_ENDPOINT, {
                    method: 'GET',
                    headers: {
                        'Accept': 'application/json'
                    }
                });

                if (!response.ok) throw new Error(`HTTP Error: ${response.status}`);
                
                const data = await response.json();
                processItems(data.items || []);
                
                statusText.innerText = `Aktualizováno: ${new Date().toLocaleTimeString('cs-CZ', {hour: '2-digit', minute:'2-digit', second:'2-digit'})}`;
                statusText.className = "text-emerald-400";
            } catch (err) {
                console.warn("Backend API Fetch failed", err);
                statusText.innerText = "Chyba načítání serveru";
                statusText.className = "text-amber-400";
            } finally {
                refreshIcon.classList.remove('fa-spin');
                renderCards();
            }
        }

        function processItems(items) {
            latestDataMap.clear();

            items.forEach(item => {
                if (!item.l || !item.s) return;

                const linka = String(item.l);
                const spoj = String(item.s);

                const key = `${linka}-${spoj}`;
                latestDataMap.set(key, {
                    linka: linka,
                    spoj: spoj,
                    cil: formatStopName(item.dest || 'Neznámý cíl'),
                    posledniZastavka: formatStopName(item.p_stop || '-'),
                    nasledujiciZastavka: formatStopName(item.n_stop || '-'),
                    spz: item.plate || '',
                    delayMin: item.d !== undefined ? item.d : 0,
                    delayTxt: item.d_txt || '',
                    time: item.t || ''
                });
            });
        }

        function formatStopName(name) {
            if (!name) return '';
            return name
                .replace(/^Ostrava,/i, 'OV,')
                .replace(/^Frýdek-Místek,/i, 'FM,');
        }

        function renderCards() {
            const container = document.getElementById('cards-container');
            const emptyState = document.getElementById('empty-state');

            if (subscriptions.length === 0) {
                container.innerHTML = '';
                emptyState.classList.remove('hidden');
                return;
            }

            emptyState.classList.add('hidden');
            let html = '';

            subscriptions.forEach(sub => {
                const key = `${sub.linka}-${sub.spoj}`;
                const liveData = latestDataMap.get(key);

                if (liveData) {
                    const isVcas = liveData.delayMin === 0;
                    const delayText = isVcas ? 'Včas' : `+${liveData.delayMin}'`;
                    
                    // Delay styling for embedded arrow badge
                    const badgeBg = isVcas ? 'bg-emerald-600 text-white' : 'bg-amber-500 text-slate-950 font-black';
                    const arrowLineColor = isVcas ? 'border-emerald-500' : 'border-amber-500';

                    html += `
                        <div class="glass-panel rounded-2xl p-3.5 space-y-3 border border-slate-700/80 shadow-lg relative overflow-hidden">
                            <div class="absolute top-0 left-0 w-1.5 h-full ${isVcas ? 'bg-emerald-500' : 'bg-amber-500'}"></div>

                            <!-- Header: Linka/Spoj + Cíl + (SPZ) + Delete Button -->
                            <div class="flex items-center justify-between gap-2 pl-1">
                                <div class="flex items-center space-x-2 truncate min-w-0">
                                    <span class="bg-blue-600 text-white font-black text-lg px-2.5 py-0.5 rounded-lg tracking-wide shrink-0">
                                        ${liveData.linka}
                                    </span>
                                    <span class="bg-slate-800 text-slate-300 font-bold text-sm px-2 py-0.5 rounded-md border border-slate-700 shrink-0">
                                        /${liveData.spoj}
                                    </span>
                                    <span class="text-base font-bold text-white truncate">
                                        ${liveData.cil}
                                    </span>
                                    ${liveData.spz ? `<span class="text-xs text-slate-400 font-medium shrink-0">(${liveData.spz})</span>` : ''}
                                </div>
                                <button onclick="removeSubscription('${sub.linka}', '${sub.spoj}')" title="Odebrat" class="text-slate-400 hover:text-red-400 p-1 shrink-0">
                                    <i class="fa-solid fa-xmark text-base"></i>
                                </button>
                            </div>

                            <!-- Integrated Route & Delay Arrow Display -->
                            <div class="bg-slate-900/80 rounded-xl p-3 border border-slate-800/90 flex items-center justify-between gap-2">
                                <!-- Poslední Zastávka -->
                                <div class="flex-1 text-left min-w-0 px-1">
                                    <div class="font-bold text-slate-100 text-xs sm:text-sm leading-snug break-words line-clamp-2">
                                        ${liveData.posledniZastavka}
                                    </div>
                                </div>

                                <!-- Arrow with Delay Embedded -->
                                <div class="flex flex-col items-center justify-center shrink-0 px-1 relative w-24">
                                    <div class="w-full border-t-2 border-dashed ${arrowLineColor} absolute top-1/2 -translate-y-1/2 z-0"></div>
                                    <span class="z-10 text-[11px] font-extrabold px-2 py-0.5 rounded-full shadow-md ${badgeBg}">
                                        ${delayText}
                                    </span>
                                </div>

                                <!-- Následující Zastávka -->
                                <div class="flex-1 text-right min-w-0 px-1">
                                    <div class="font-bold text-blue-400 text-xs sm:text-sm leading-snug break-words line-clamp-2">
                                        ${liveData.nasledujiciZastavka}
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                } else {
                    html += `
                        <div class="glass-panel rounded-2xl p-3 space-y-2 border border-slate-800/60 opacity-60">
                            <div class="flex items-center justify-between">
                                <div class="flex items-center space-x-2">
                                    <span class="bg-slate-800 text-slate-300 font-bold text-base px-2.5 py-0.5 rounded-lg border border-slate-700">
                                        ${sub.linka}
                                    </span>
                                    <span class="text-slate-400 text-sm font-semibold">
                                        /${sub.spoj}
                                    </span>
                                </div>
                                <div class="flex items-center space-x-2">
                                    <span class="text-[10px] bg-slate-800 text-slate-400 px-2 py-0.5 rounded-full border border-slate-700/80">
                                        Není v provozu
                                    </span>
                                    <button onclick="removeSubscription('${sub.linka}', '${sub.spoj}')" title="Odebrat" class="text-slate-500 hover:text-red-400 p-1">
                                        <i class="fa-solid fa-xmark text-sm"></i>
                                    </button>
                                </div>
                            </div>
                        </div>
                    `;
                }
            });

            container.innerHTML = html;
        }

        function startTimer() {
            clearInterval(timerInterval);
            countdown = 40;
            updateBadge();
            
            timerInterval = setInterval(() => {
                countdown--;
                updateBadge();
                if (countdown <= 0) {
                    countdown = 40;
                    fetchMapData();
                }
            }, 1000);
        }

        function updateBadge() {
            document.getElementById('timer-badge').innerText = countdown;
        }

        function manualRefresh() {
            startTimer();
            fetchMapData();
        }

        function toggleSettingsModal(show) {
            const modal = document.getElementById('settings-modal');
            if (show) modal.classList.remove('hidden');
            else modal.classList.add('hidden');
        }

        function toggleDailyResetSetting(checked) {
            dailyResetEnabled = checked;
            localStorage.setItem('odis_daily_reset', checked);
        }

        function injectDemoData() {
            const mockItems = [
                {
                    l: "440", s: "54", d: 0, d_txt: "$z1~min.~29~s",
                    dest: "Havířov,Šumbark", p_stop: "Ostrava,Kunčice,NH Zářičí",
                    n_stop: "Ostrava,Bartovice,Pod Tratí", plate: "9T46105", t: new Date().toLocaleTimeString('cs-CZ')
                },
                {
                    l: "543", s: "42", d: 3, d_txt: "$z1~min.~50~s",
                    dest: "Dětmarovice,žel.st.", p_stop: "Ostrava,Heřmanice",
                    n_stop: "Rychvald,zámek", plate: "1TJ7104", t: new Date().toLocaleTimeString('cs-CZ')
                }
            ];
            processItems(mockItems);
            renderCards();
            toggleSettingsModal(false);
            showToast("Testovací data byla úspěšně načtena!");
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-msg').innerText = msg;
            toast.classList.remove('opacity-0', 'pointer-events-none');
            toast.classList.add('opacity-100');
            
            setTimeout(() => {
                toast.classList.remove('opacity-100');
                toast.classList.add('opacity-0', 'pointer-events-none');
            }, 3000);
        }
    </script>
</body>
</html>
