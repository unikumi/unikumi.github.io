<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Interaktív Vektoros Térkép</title>

  <!-- MapLibre GL JS (Vektoros térképmotor) -->
  <script src="https://unpkg.com/maplibre-gl@^4.0.0/dist/maplibre-gl.js"></script>
  <link href="https://unpkg.com/maplibre-gl@^4.0.0/dist/maplibre-gl.css" rel="stylesheet" />

  <style>
    body, html { margin: 0; padding: 0; height: 100%; width: 100%; font-family: sans-serif; overflow: hidden; }
    #map { width: 100%; height: 100%; position: absolute; top: 0; bottom: 0; }

    /* Vezérlőelemek a jobb felső sarokban */
    .top-controls {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: flex-end;
    }

    select.layer-dropdown {
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid #ccc;
      background: white;
      font-weight: bold;
      font-size: 14px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.25);
      max-width: 280px;
      outline: none;
    }

      /* CSS módosítás */
      .btn-follow {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        border: none;
        background: white;
        font-size: 20px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.25);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0;
        transition: background-color 0.2s, transform 0.1s;
      }
      
      .btn-follow.active {
        background: #007bff;
        /* Szükség esetén az emoji színét filterrel lehet igazítani, de alapesetben jól látható */
      }

    /* Pont és felirat glória stílusa (Python HTML/CSS mintájára) */
    .marker-container {
      display: flex;
      align-items: center;
      pointer-events: none;
      transform: translate(-6px, -6px);
    }

    .marker-dot {
      width: 10px;
      height: 10px;
      background-color: white;
      border: 2px solid #21e077;
      border-radius: 50%;
      box-shadow: 0 0 2px rgba(0,0,0,0.4);
      flex-shrink: 0;
    }

    .label-text {
      color: #21e077;
      font-size: 12px;
      font-weight: bold;
      white-space: nowrap;
      margin-left: 6px;
      text-shadow:
        -1px -1px 0 white,
         1px -1px 0 white,
        -1px  1px 0 white,
         1px  1px 0 white;
    }

    /* Saját pozíció nyilacska (Bearing mutató) */
    .user-marker {
      width: 26px;
      height: 26px;
      background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%23007bff" stroke="white" stroke-width="1.5"><polygon points="12,2 19,21 12,17 5,21"/></svg>');
      background-size: cover;
      transition: transform 0.1s linear;
    }
  </style>
</head>
<body>

  <div id="map"></div>

  <div class="top-controls">
    <select id="layerSelect" class="layer-dropdown">
      <option>Rétegek betöltése...</option>
    </select>

    <!-- HTML gomb (szöveg nélkül, tisztán emoji) -->
    <button id="btnFollow" class="btn-follow" title="Tájolás &amp; Követés">🧭</button>
  </div>

  <script>
    // A fő lista Gist nyers (raw) URL-je
    const LIST_URL = "https://gist.githubusercontent.com/unikumi/2b35bd479eb40c8bc6ff06e57f8658b0/raw/e5e240fd4ab7d29514839336d71b142e94a2d71a/gistfile1.txt";
    
    
    // Egyszerű, natív adatletöltő (CORS proxy nélkül!)
    async function fetchJson(url) {
      const res = await fetch(url);
      if (!res.ok) throw new Error(`Hiba a letöltés során: ${res.status}`);
      return await res.json();
    }

    // 1. Térkép inicializálása az OpenFreeMap sötét stílusával
    const map = new maplibregl.Map({
      container: 'map',
      style: 'https://tiles.openfreemap.org/styles/dark',
      center: [16.0, 49.0],
      zoom: 10
    });
    
    // 2. Rétegek testreszabása a stílus betöltése után
    map.on('style.load', () => {
      const styleLayers = map.getStyle().layers;
    
      styleLayers.forEach(layer => {
        const id = layer.id.toLowerCase();
    
        // 1. Háttér és víz besötétítése
        if (layer.type === 'background') {
          map.setPaintProperty(layer.id, 'background-color', '#050508');
        }
        if (id.includes('water') && layer.type === 'fill') {
          map.setPaintProperty(layer.id, 'fill-color', '#0f2038');
        }
        if ((id.includes('landcover') || id.includes('landuse') || id.includes('park')) && layer.type === 'fill') {
          map.setPaintProperty(layer.id, 'fill-opacity', 0.1);
        }
    
        // 2. Gyalog- és kerékpárutak vonalainak elrejtése
        if ((id.includes('foot') || id.includes('cycle') || id.includes('path') || id.includes('pedestrian')) && layer.type === 'line') {
          map.setLayoutProperty(layer.id, 'visibility', 'none');
        }
    
        // 3. Vasútvonalak: Neon narancs
        if (id.includes('rail') || id.includes('railway')) {
          map.setLayoutProperty(layer.id, 'visibility', 'visible');
          if (layer.type === 'line') {
            map.setPaintProperty(layer.id, 'line-color', '#ff9f0a');
            map.setPaintProperty(layer.id, 'line-width', 2.5);
          }
        }
    
        // 4. Úthálózat vonalai
        if (id.includes('highway') || id.includes('road') || id.includes('street') || id.includes('bridge') || id.includes('tunnel')) {
          if (layer.type === 'line') {
            if (id.includes('motorway') || id.includes('trunk')) {
              map.setPaintProperty(layer.id, 'line-color', '#ffd60a');
              map.setPaintProperty(layer.id, 'line-width', 3);
              map.setPaintProperty(layer.id, 'line-opacity', 1.0);
            } else if (id.includes('primary') || id.includes('secondary')) {
              map.setPaintProperty(layer.id, 'line-color', '#ffffff');
              map.setPaintProperty(layer.id, 'line-width', 2);
              map.setPaintProperty(layer.id, 'line-opacity', 1.0);
            } else {
              map.setPaintProperty(layer.id, 'line-color', '#7a8b9e');
              map.setPaintProperty(layer.id, 'line-opacity', 0.85);
            }
          }
        }
    
        // 5. Utcanevek és helynevek: Világossárga szöveg + vastag fekete glória
        if (layer.type === 'symbol') {
          map.setLayoutProperty(layer.id, 'visibility', 'visible');
    
          try {
            map.setPaintProperty(layer.id, 'text-color', '#fff380');      // Világossárga felirat
            map.setPaintProperty(layer.id, 'text-halo-color', '#000000'); // Éles fekete kontúr
            map.setPaintProperty(layer.id, 'text-halo-width', 2.2);       // Megnövelt glória a maximális kontraszthoz
          } catch (e) {
            // Csupán ikont tartalmazó rétegek kihagyása
          }
        }
      });
      // --- 6. EGYIRÁNYÚ UTCÁK NYILAINAK HOZZÁADÁSA ---
      
        // A) Nyíl ikon generálása Canvas-ból (külső képfájl nélkül)
        const canvas = document.createElement('canvas');
        canvas.width = 24;
        canvas.height = 24;
        const ctx = canvas.getContext('2d');
        
        // Világossárga nyíl fekete kontúrral (hogy minden útszínen jól látszódjon)
        ctx.fillStyle = '#fff380';
        ctx.strokeStyle = '#000000';
        ctx.lineWidth = 1.5;
        
        ctx.beginPath();
        ctx.moveTo(4, 6);
        ctx.lineTo(18, 12);
        ctx.lineTo(4, 18);
        ctx.lineTo(8, 12); // Nyíl belső bevágása
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
      
        const imageData = ctx.getImageData(0, 0, 24, 24);
        map.addImage('oneway-arrow', imageData);
      
        // --- 6. EGYIRÁNYÚ UTCÁK NYILAINAK HOZZÁADÁSA ---

      // A) Négyzetes nyíl ikon generálása (Élénk neonsárga + fekete kontúr)
      if (!map.hasImage('oneway-arrow')) {
        const canvas = document.createElement('canvas');
        canvas.width = 32;
        canvas.height = 32;
        const ctx = canvas.getContext('2d');
      
        ctx.fillStyle = '#ffd60a';   // Élénk neonsárga
        ctx.strokeStyle = '#000000'; // Fekete kontúr
        ctx.lineWidth = 2.5;
      
        ctx.beginPath();
        ctx.moveTo(6, 8);
        ctx.lineTo(26, 16);
        ctx.lineTo(6, 24);
        ctx.lineTo(12, 16); // Belső bevágás
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
      
        const imageData = ctx.getImageData(0, 0, 32, 32);
        map.addImage('oneway-arrow', imageData);
      }
      
      // B) Forrás-azonosító automatikus lekérése az OpenFreeMap stílusból
      const transLayer = map.getStyle().layers.find(l => l['source-layer'] === 'transportation');
      const realSourceId = transLayer ? transLayer.source : 'openmaptiles';
      
      // C) Réteg hozzáadása
      if (!map.getLayer('oneway-arrows')) {
        map.addLayer({
          id: 'oneway-arrows',
          type: 'symbol',
          source: realSourceId,
          'source-layer': 'transportation',
          minzoom: 14, // Fontos: Az 'oneway' adat csak 14-es zoom felett van jelen a csempékben!
          filter: [
            'all',
            ['==', '$type', 'LineString'],
            ['in', 'oneway', 1, -1]
          ],
          layout: {
            'symbol-placement': 'line',
            'symbol-spacing': 80,
            'icon-image': 'oneway-arrow',
            'icon-size': 0.6,
            'icon-allow-overlap': true,
            'icon-ignore-placement': true,
            'icon-rotation-alignment': 'map',
            'icon-rotate': ['match', ['get', 'oneway'], -1, 180, 0]
          }
        });
      }
      
    });
    map.addControl(new maplibregl.NavigationControl({ showCompass: true }), 'bottom-right');

    let layerList = [];
    let currentMarkers = [];
    let userLocation = null;
    let userHeading = 0;
    let isFollowing = false;
    let userInteracting = false;
    let interactionTimeout = null;
    let wakeLock = null;

    // Képernyőzár bekapcsolása
    async function requestWakeLock() {
      try {
        if ('wakeLock' in navigator) {
          wakeLock = await navigator.wakeLock.request('screen');
        }
      } catch (err) {
        console.warn(`Wake Lock nem indítható el: ${err.message}`);
      }
    }
    
    // Képernyőzár feloldása
    function releaseWakeLock() {
      if (wakeLock !== null) {
        wakeLock.release().then(() => {
          wakeLock = null;
        });
      }
    }
    
    // Ha a felhasználó átvált más appra majd visszatér, a böngésző alapból elengedi a zárat.
    // Ezzel automatikusan újraigényeljük, ha a követés még aktív:
    document.addEventListener('visibilitychange', async () => {
      if (wakeLock !== null && document.visibilityState === 'visible' && isFollowing) {
        await requestWakeLock();
      }
    });

    
    // Felhasználó marker eleme
    const userMarkerEl = document.createElement('div');
    userMarkerEl.className = 'user-marker';
    let userMarker = null;

    // GeoJSON érvényesítés (Python fix_geojson megfelelője)
    function fixGeojson(data) {
      if (!data || typeof data !== 'object') return { type: "FeatureCollection", features: [] };
      if (data.type === "FeatureCollection") {
        (data.features || []).forEach(f => { if (!f.properties) f.properties = {}; });
      }
      return data;
    }

    // Keret számítása (Python get_bounds megfelelője)
    function fitDataBounds(geojson, markers) {
      const bounds = new maplibregl.LngLatBounds();
      let count = 0;

      if (geojson && geojson.features) {
        geojson.features.forEach(f => {
          if (f.geometry && f.geometry.type === "LineString") {
            f.geometry.coordinates.forEach(coord => { bounds.extend(coord); count++; });
          }
        });
      }

      markers.forEach(m => {
        if (m.lat && m.lng) { bounds.extend([m.lng, m.lat]); count++; }
      });

      if (count > 0 && !isFollowing) {
        map.fitBounds(bounds, { padding: 40 });
      }
    }

    // Réteg betöltése index alapján
    async function loadLayer(index) {
      const item = layerList[index];
      if (!item) return;

      const [rawGeojson, markersData] = await Promise.all([
        fetchJson(item.geojson),
        fetchJson(item.markers)
      ]);

      const geojsonData = fixGeojson(rawGeojson);

      // Vonallánc frissítése / hozzáadása
      if (map.getSource('route-source')) {
        map.getSource('route-source').setData(geojsonData);
      } else {
        map.addSource('route-source', { type: 'geojson', data: geojsonData });
        map.addLayer({
          id: 'route-layer',
          type: 'line',
          source: 'route-source',
          paint: {
            'line-color': '#1ccead',
            'line-width': 4
          }
        });
      }

      // Korábbi jelölők törlése
      currentMarkers.forEach(m => m.remove());
      currentMarkers = [];

      // Új Circle + Label jelölők felrakása
      (markersData || []).forEach(pt => {
        if (pt.lat === undefined || pt.lng === undefined) return;

        const el = document.createElement('div');
        el.className = 'marker-container';
        el.innerHTML = `
          <div class="marker-dot"></div>
          <div class="label-text">${pt.name || ''}</div>
        `;

        const marker = new maplibregl.Marker({ element: el, anchor: 'left' })
          .setLngLat([pt.lng, pt.lat])
          .addTo(map);

        currentMarkers.push(marker);
      });

      fitDataBounds(geojsonData, markersData || []);
    }

    // Felhasználói beavatkozás érzékelése és 5 mp-es időzítő indítása
    function handleUserInteraction() {
      if (!isFollowing) return;
    
      userInteracting = true;
    
      if (interactionTimeout) {
        clearTimeout(interactionTimeout);
      }
    
      // 5 másodperc (5000 ms) tétlenség után újra centralizálunk
      interactionTimeout = setTimeout(() => {
        userInteracting = false;
        
        // Sima animációval visszatérünk a felhasználó pozíciójához és tájolásához
        if (isFollowing && userLocation) {
          map.easeTo({
            center: userLocation,
            bearing: userHeading,
            duration: 1000 // 1 másodperces lágy animáció
          });
        }
      }, 5000);
    }
    
    // Gesztusok / interakciók figyelése a térképen
    map.on('dragstart', handleUserInteraction);
    map.on('rotatestart', handleUserInteraction);
    map.on('zoomstart', handleUserInteraction);
    map.on('pitchstart', handleUserInteraction);
    
    function updatePositionAndBearing() {
      if (!userLocation || isNaN(userLocation[0]) || isNaN(userLocation[1])) return;
    
      // Biztonságos forgatási érték (ha a telefon null-t ad vissza, megtartjuk a 0-t)
      const safeHeading = (typeof userHeading === 'number' && !isNaN(userHeading)) ? userHeading : 0;
    
      if (!userMarker) {
        userMarker = new maplibregl.Marker({ 
          element: userMarkerEl,
          rotationAlignment: 'map' // A nyíl a térkép elforgatásával együtt forogjon
        })
          .setLngLat(userLocation)
          .setRotation(safeHeading)
          .addTo(map);
      } else {
        userMarker.setLngLat(userLocation);
        userMarker.setRotation(safeHeading); // A MapLibre kezeli a forgatást a translate megtartásával!
      }
    
      // userMarkerEl.style.transform = ... <-- EZT A SORT TELJESEN TÖRÖLD KI!
    
      if (isFollowing && !userInteracting) {
        map.jumpTo({
          center: userLocation,
          bearing: safeHeading
        });
      }
    }

    // 1. Geolocation API (GPS nyomkövetés)
    if ('geolocation' in navigator) {
      navigator.geolocation.watchPosition(
        (pos) => {
          userLocation = [pos.coords.longitude, pos.coords.latitude];
          if (pos.coords.heading !== null && !isNaN(pos.coords.heading)) {
            userHeading = pos.coords.heading;
          }
          updatePositionAndBearing();
        },
        (err) => console.warn("GPS hiba:", err),
        { enableHighAccuracy: true }
      );
    }

    // 2. Gyroskóp / Kompassz eseménykezelő (Álló helyzeti tájolás)
    function handleOrientation(e) {
      let heading = null;
      if (e.webkitCompassHeading !== undefined) {
        heading = e.webkitCompassHeading; // iOS
      } else if (e.alpha !== null) {
        heading = 360 - e.alpha; // Android
      }
      if (heading !== null) {
        userHeading = heading;
        updatePositionAndBearing();
      }
    }

    // Gomb eseménykezelője
    const btnFollow = document.getElementById('btnFollow');
    btnFollow.addEventListener('click', async () => {
      isFollowing = !isFollowing;
      btnFollow.classList.toggle('active', isFollowing);
    
      if (isFollowing) {
        await requestWakeLock(); // <-- Képernyő ébren tartásának bekapcsolása
        userInteracting = false; // Bekapcsoláskor azonnal átvesszük a vezérlést
        
        if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
          try {
            const resp = await DeviceOrientationEvent.requestPermission();
            if (resp === 'granted') {
              window.addEventListener('deviceorientation', handleOrientation, true);
            }
          } catch (e) { console.error(e); }
        } else {
          window.addEventListener('deviceorientationabsolute', handleOrientation, true) ||
          window.addEventListener('deviceorientation', handleOrientation, true);
        }
        
        if (userLocation) {
          map.flyTo({ center: userLocation, bearing: userHeading, zoom: 16 });
        }
        updatePositionAndBearing();
      } else {
        releaseWakeLock();
        if (interactionTimeout) clearTimeout(interactionTimeout);
        userInteracting = false;
        map.setBearing(0); // Kikapcsoláskor vissza északra
      }
    });

    // Alkalmazás indítása
    map.on('load', async () => {
      layerList = await fetchJson(LIST_URL);

      const dropdown = document.getElementById('layerSelect');
      dropdown.innerHTML = layerList.map((item, i) => `<option value="${i}">${item.name}</option>`).join('');

      dropdown.addEventListener('change', (e) => loadLayer(e.target.value));

      // Első réteg betöltése
      if (layerList.length > 0) {
        loadLayer(0);
      }
    });
  </script>
</body>
</html>
